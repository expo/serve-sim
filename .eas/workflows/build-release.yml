name: Build @expo/serve-sim release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to pack. Leave empty to pack the version in package.json.
        type: string
        required: false
        default: ""

defaults:
  tools:
    node: 24
    bun: 1.3.14

jobs:
  package:
    name: Build npm package
    runs_on: macos-medium
    image: latest
    steps:
      - uses: eas/checkout

      - uses: eas/install_node_modules

      # Canaries are not committed to git, so the release workflow passes the
      # version here instead. This runs after the install, so that the install
      # sees the same package.json that the lockfile was built from, and before
      # the build, because build.ts stamps the version into the bundle.
      - name: Set package version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            npm pkg set version="$VERSION" --workspace packages/serve-sim
          fi

      - name: Build native helpers and package
        run: bun run --filter '@expo/serve-sim' build

      - name: Create npm package
        run: |
          mkdir -p release
          npm pack --workspace packages/serve-sim --pack-destination release --json > /tmp/npm-pack.json
          TARBALL=$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename' < /tmp/npm-pack.json)
          mv "release/$TARBALL" release/serve-sim.tgz

      - name: Upload npm package
        uses: eas/upload_artifact
        with:
          type: other
          name: serve-sim-npm-package
          path: release/serve-sim.tgz
