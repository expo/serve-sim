name: Build @expo/serve-sim release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact npm version to package
        required: true
        type: string

defaults:
  tools:
    node: 24
    bun: 1.3.14

jobs:
  package:
    name: Build npm package
    runs_on: macos-medium
    image: latest
    steps:
      - uses: eas/checkout

      - uses: eas/install_node_modules

      - name: Set npm package version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const version = process.env.RELEASE_VERSION;
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-next\.(0|[1-9]\d*)\.(0|[1-9]\d*))?$/.test(version ?? "")) {
              throw new Error(`Invalid release version: ${JSON.stringify(version)}`);
            }
          '
          npm version "$RELEASE_VERSION" --allow-same-version --no-git-tag-version --no-package-lock --no-workspaces-update --workspace packages/serve-sim

      - name: Build native helpers and package
        run: bun run --filter '@expo/serve-sim' build

      - name: Create npm package
        run: |
          mkdir -p release
          npm pack --workspace packages/serve-sim --pack-destination release --json > /tmp/npm-pack.json
          TARBALL=$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename' < /tmp/npm-pack.json)
          mv "release/$TARBALL" release/serve-sim.tgz

      - name: Upload npm package
        uses: eas/upload_artifact
        with:
          type: other
          name: serve-sim-npm-package
          path: release/serve-sim.tgz
