name: serve-sim tests

on:
  pull_request:
    paths:
      - packages/serve-sim/**
      - .eas/workflows/sim-test.yml
  pull_request_labeled:
    labels: [eas-approved]

# Cancel superseded runs so pushing twice to the same PR does not consume two
# macOS workers in parallel.
concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    node: 22
    bun: 1.3.14

jobs:
  sim-test:
    name: Build and test serve-sim
    runs_on: macos-medium
    image: latest
    steps:
      - uses: eas/checkout

      - uses: eas/install_node_modules

      # The permissions e2e test drives the built CLI (dist/serve-sim.js), so
      # build it before running the test suite.
      - name: Build serve-sim
        run: bun run build.ts
        working_directory: packages/serve-sim

      # Packed before the tests run so the tarball exists even when they fail:
      # a build is often worth trying on a device precisely because the tests
      # did not settle the question.
      - name: Create npm package
        run: |
          mkdir -p release
          npm pack --workspace packages/serve-sim --pack-destination release --json > /tmp/npm-pack.json
          TARBALL=$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename' < /tmp/npm-pack.json)
          mv "release/$TARBALL" release/serve-sim.tgz

      - name: Upload npm package
        uses: eas/upload_artifact
        with:
          type: other
          name: serve-sim-npm-package
          path: release/serve-sim.tgz

      - name: Start iOS Simulator
        uses: eas/start_ios_simulator

      - name: Run serve-sim tests
        run: |
          probe() {
            label="$1"; shift
            "$@" >/tmp/probe.out 2>&1 &
            pid=$!
            for _ in 1 2 3 4 5; do
              sleep 1
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid"
                echo "  RETURNED  $label :: $(head -c 200 /tmp/probe.out)"
                return
              fi
            done
            echo "  BLOCKED   $label (still running after 5s)"
            kill -9 "$pid" 2>/dev/null
          }

          echo "===== file types ====="
          for d in "$HOME" "$HOME/Desktop" "$HOME/Documents" "$HOME/Downloads" /tmp; do
            stat -f '%HT  %Sp  %N' "$d" 2>&1 || true
          done

          echo "===== does stat block? (never TCC-gated) ====="
          for d in "$HOME" "$HOME/Desktop" "$HOME/Documents" "$HOME/Downloads" /tmp; do
            probe "node lstat   $d" node -e "console.log(require('fs').lstatSync(process.argv[1]).isDirectory())" "$d"
          done

          echo "===== does open block? (TCC-gated for Desktop/Documents/Downloads) ====="
          for d in "$HOME" "$HOME/Desktop" "$HOME/Documents" "$HOME/Downloads" /tmp; do
            probe "node open    $d" node -e "console.log('fd', require('fs').openSync(process.argv[1], 'r'))" "$d"
          done

          echo "===== bun: realpath, open, readdir ====="
          for d in "$HOME" "$HOME/Desktop" /tmp; do
            probe "bun realpath $d" bun -e "console.log(require('fs').realpathSync(process.argv[2]))" x "$d"
            probe "bun open     $d" bun -e "console.log('fd', require('fs').openSync(process.argv[2], 'r'))" x "$d"
            probe "bun readdir  $d" bun -e "console.log(require('fs').readdirSync(process.argv[2]).length)" x "$d"
          done

          echo "===== node realpath (lstat-based, expected fine) ====="
          for d in "$HOME/Desktop" "$HOME/Documents"; do
            probe "node realpath $d" node -e "console.log(require('fs').realpathSync(process.argv[1]))" "$d"
          done

          exit 1
