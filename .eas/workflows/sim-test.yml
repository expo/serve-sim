name: serve-sim tests

on:
  pull_request:
    paths:
      - packages/serve-sim/**
      - .eas/workflows/sim-test.yml
  pull_request_labeled:
    labels: [eas-approved]

# Cancel superseded runs so pushing twice to the same PR does not consume two
# macOS workers in parallel.
concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    node: 22
    bun: 1.3.14

jobs:
  sim-test:
    name: Build and test serve-sim
    runs_on: macos-medium
    image: latest
    steps:
      - uses: eas/checkout

      - uses: eas/install_node_modules

      # The permissions e2e test drives the built CLI (dist/serve-sim.js), so
      # build it before running the test suite.
      - name: Build serve-sim
        run: bun run build.ts
        working_directory: packages/serve-sim

      # Packed before the tests run so the tarball exists even when they fail:
      # a build is often worth trying on a device precisely because the tests
      # did not settle the question.
      - name: Create npm package
        run: |
          mkdir -p release
          npm pack --workspace packages/serve-sim --pack-destination release --json > /tmp/npm-pack.json
          TARBALL=$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename' < /tmp/npm-pack.json)
          mv "release/$TARBALL" release/serve-sim.tgz

      - name: Upload npm package
        uses: eas/upload_artifact
        with:
          type: other
          name: serve-sim-npm-package
          path: release/serve-sim.tgz

      - name: Start iOS Simulator
        uses: eas/start_ios_simulator

      - name: Run serve-sim tests
        run: |
          rm -f /tmp/serve-sim-trace.log
          bun test --max-concurrency=1 packages/serve-sim/src/__tests__/ &
          TEST_PID=$!

          for _ in $(seq 1 36); do
            sleep 5
            if ! kill -0 "$TEST_PID" 2>/dev/null; then
              wait "$TEST_PID"
              exit $?
            fi
          done

          echo "===== wedged after 180s: pid $TEST_PID ====="
          sample "$TEST_PID" 3 -mayDie -file /tmp/sample.txt || true
          echo "===== main thread only ====="
          awk '/^ *[0-9]+ Thread_/{n++} n<=1' /tmp/sample.txt | tail -40 || true

          echo "===== pipes, ttys and char devices the process holds ====="
          lsof -p "$TEST_PID" 2>/dev/null | grep -Ei "fifo|pipe|chr|tty|noderoot" || echo "(none)"

          echo "===== last 45 trace lines ====="
          tail -45 /tmp/serve-sim-trace.log || echo "(no trace file)"

          kill -9 "$TEST_PID" || true
          exit 1
