name: Release @expo/serve-sim

run-name: Release @expo/serve-sim by @${{ github.actor }}

on:
  workflow_dispatch:

concurrency:
  group: release-expo-serve-sim
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build with EAS and publish
    if: github.repository == 'expo/serve-sim' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify package version
        run: |
          VERSION=$(node -p "require('./packages/serve-sim/package.json').version")
          if npm view "@expo/serve-sim@$VERSION" version >/dev/null 2>&1; then
            echo "::error::@expo/serve-sim@$VERSION is already published. Bump the package version in a pull request first."
            exit 1
          fi

      - name: Build npm package with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_DEV_EXPO_GITHUB_ROBOT_ACCESS_TOKEN }}
        run: |
          npx --yes eas-cli@21.0.1 workflow:run .eas/workflows/build-release.yml \
            --ref "$GITHUB_SHA" \
            --wait \
            --non-interactive \
            --json > /tmp/eas-workflow.json

      - name: Download and verify EAS artifact
        run: |
          EAS_STATUS=$(jq -r '.status // empty' /tmp/eas-workflow.json)
          if [ "$EAS_STATUS" != "SUCCESS" ]; then
            echo "::error::EAS workflow finished with status: $EAS_STATUS."
            exit 1
          fi

          EAS_SHA=$(jq -r '.gitCommitHash // empty' /tmp/eas-workflow.json)
          if [ "$EAS_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::EAS built $EAS_SHA instead of $GITHUB_SHA."
            exit 1
          fi

          ARTIFACT_COUNT=$(jq '[
            .jobs[]
            | .turtleJobRun.artifacts[]?
            | select(.name == "serve-sim-npm-package" and .downloadUrl != null)
          ] | length' /tmp/eas-workflow.json)
          if [ "$ARTIFACT_COUNT" != "1" ]; then
            echo "::error::Expected one serve-sim npm artifact, found $ARTIFACT_COUNT."
            exit 1
          fi

          ARTIFACT_URL=$(jq -er '
            .jobs[]
            | .turtleJobRun.artifacts[]?
            | select(.name == "serve-sim-npm-package" and .downloadUrl != null)
            | .downloadUrl
          ' /tmp/eas-workflow.json)
          echo "::add-mask::$ARTIFACT_URL"
          curl --fail --location "$ARTIFACT_URL" --output /tmp/serve-sim.tgz

          EXPECTED_VERSION=$(node -p "require('./packages/serve-sim/package.json').version")
          PACKAGE_JSON=$(tar -xOf /tmp/serve-sim.tgz package/package.json)
          ACTUAL_NAME=$(printf '%s' "$PACKAGE_JSON" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
          ACTUAL_VERSION=$(printf '%s' "$PACKAGE_JSON" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          ACTUAL_CPU=$(printf '%s' "$PACKAGE_JSON" | node -p 'JSON.stringify(JSON.parse(require("fs").readFileSync(0, "utf8")).cpu)')

          [ "$ACTUAL_NAME" = "@expo/serve-sim" ] || { echo "::error::Unexpected package name: $ACTUAL_NAME"; exit 1; }
          [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ] || { echo "::error::Expected version $EXPECTED_VERSION, got $ACTUAL_VERSION"; exit 1; }
          [ "$ACTUAL_CPU" = '["arm64"]' ] || { echo "::error::Unexpected CPU constraint: $ACTUAL_CPU"; exit 1; }

          CONTENTS=$(tar -tzf /tmp/serve-sim.tgz)
          for REQUIRED_PATH in \
            package/dist/serve-sim.js \
            package/dist/native/serve-sim-native.node \
            package/dist/bin/LiveKitWebRTC.framework/LiveKitWebRTC; do
            printf '%s\n' "$CONTENTS" | grep -Fxq "$REQUIRED_PATH" || {
              echo "::error::Missing required package file: $REQUIRED_PATH"
              exit 1
            }
          done

          VERIFY_DIR=$(mktemp -d)
          tar -xzf /tmp/serve-sim.tgz -C "$VERIFY_DIR" \
            package/dist/native/serve-sim-native.node \
            package/dist/bin/LiveKitWebRTC.framework/LiveKitWebRTC
          for BINARY in \
            "$VERIFY_DIR/package/dist/native/serve-sim-native.node" \
            "$VERIFY_DIR/package/dist/bin/LiveKitWebRTC.framework/LiveKitWebRTC"; do
            file "$BINARY" | grep -q arm64 || {
              echo "::error::Package contains a non-arm64 binary: $BINARY"
              exit 1
            }
          done

      - name: Publish to npm with OIDC
        run: npm publish /tmp/serve-sim.tgz
