name: Release @expo/serve-sim

run-name: Release @expo/serve-sim (${{ inputs.bump }}) by @${{ github.triggering_actor }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer component to bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      confirm:
        description: Type @expo/serve-sim to confirm the npm release
        required: true
        type: string

# Only one release may calculate and publish the next version at a time.
concurrency:
  group: release-expo-serve-sim
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a confirmed manual dispatch from main
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::Releases must be started with workflow_dispatch."
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY" != "expo/serve-sim" ]; then
            echo "::error::Releases are only allowed from expo/serve-sim."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must be dispatched against main."
            exit 1
          fi
          if [ "$CONFIRM" != "@expo/serve-sim" ]; then
            echo "::error::Confirmation must exactly match @expo/serve-sim."
            exit 1
          fi

      - name: Require maintainer permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for USER in "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"; do
            ROLE=$(gh api \
              "/repos/$GITHUB_REPOSITORY/collaborators/$USER/permission" \
              --jq .role_name)
            case "$ROLE" in
              admin|maintain)
                echo "Authorized $USER with the $ROLE role."
                ;;
              *)
                echo "::error::$USER has the $ROLE role; maintain or admin is required."
                exit 1
                ;;
            esac
          done

  release:
    name: Test, publish, and create release
    needs: authorize
    runs-on: macos-26
    timeout-minutes: 30
    # Configure this environment with required maintainer reviewers, prevent
    # self-review, and restrict deployments to main.
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify the release commit
        id: retry
        env:
          DISPATCH_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" = "$DISPATCH_SHA" ]; then
            echo "recover=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_RUN_ID=$(git log -1 --format='%(trailers:key=Release-Run,valueonly)')
          PARENT_SHA=$(git rev-parse HEAD^)
          if [ "$LAST_RUN_ID" = "$RELEASE_RUN_ID" ] && [ "$PARENT_SHA" = "$DISPATCH_SHA" ]; then
            echo "Recovering release run $RELEASE_RUN_ID from $HEAD_SHA."
            echo "recover=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::main moved after this workflow was dispatched; start a new release from the current main."
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump package version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          RECOVER: ${{ steps.retry.outputs.recover }}
        run: |
          if [ "$RECOVER" = "true" ]; then
            VERSION=$(node -p "require('./packages/serve-sim/package.json').version")
          else
            npm version "$BUMP" --no-git-tag-version --workspace packages/serve-sim
            bun install --lockfile-only
            VERSION=$(node -p "require('./packages/serve-sim/package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=@expo/serve-sim@$VERSION" >> "$GITHUB_OUTPUT"

      - name: Lint and typecheck
        run: |
          bun run lint
          bun run typecheck

      - name: Build native helpers and package
        run: bun run --filter '@expo/serve-sim' build

      - name: Boot iOS simulator
        id: boot-sim
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const runtimes = Object.keys(data.devices).filter((runtime) => runtime.includes('iOS')).sort().reverse();
            for (const runtime of runtimes) {
              const device = data.devices[runtime].find((item) => item.isAvailable && item.name.includes('iPhone'));
              if (device) {
                console.log(device.udid);
                process.exit(0);
              }
            }
          ")
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator found on the release runner."
            exit 1
          fi
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          open -ga Simulator || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run serve-sim tests
        env:
          UDID: ${{ steps.boot-sim.outputs.udid }}
        run: bun test --max-concurrency=1 packages/serve-sim/src/__tests__/

      - name: Shutdown simulator
        if: always() && steps.boot-sim.outputs.udid != ''
        run: xcrun simctl shutdown "${{ steps.boot-sim.outputs.udid }}" || true

      - name: Verify npm package contents
        run: npm pack --dry-run --workspace packages/serve-sim

      - name: Commit and push the version bump
        if: steps.retry.outputs.recover != 'true'
        env:
          RELEASE_RUN_ID: ${{ github.run_id }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/serve-sim/package.json bun.lock
          git commit -m "chore: release @expo/serve-sim $VERSION" \
            -m "Release-Run: $RELEASE_RUN_ID"
          git push origin HEAD:main

      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@expo/serve-sim@$VERSION" version >/dev/null 2>&1; then
            echo "@expo/serve-sim@$VERSION is already published; continuing recovery."
          else
            npm publish --workspace packages/serve-sim
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists."
          else
            gh release create "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --title "@expo/serve-sim $VERSION" \
              --generate-notes
          fi
