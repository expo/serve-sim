name: Roll back @expo/serve-sim

run-name: Roll back @expo/serve-sim latest to ${{ inputs.version }} by @${{ github.triggering_actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version that npm `latest` should point to again, for example 0.3.0
        required: true
        type: string
      deprecate:
        description: Version to mark deprecated on npm, for example 0.3.1. Leave empty to skip.
        required: false
        type: string
      reason:
        description: One line for the deprecation message and the run log
        required: false
        type: string
        default: Rolled back. Install the version that npm latest points to.

# Same group as the release workflow, so a rollback and a release never race
# on the dist-tag.
concurrency:
  group: release-expo-serve-sim
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    name: Retag latest
    if: github.repository == 'expo/serve-sim' && github.ref == 'refs/heads/expo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify the target version is on npm
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PUBLISHED=$(npm view "@expo/serve-sim@$VERSION" version 2>/dev/null || true)
          if [ "$PUBLISHED" != "$VERSION" ]; then
            echo "::error::@expo/serve-sim@$VERSION is not on npm. Nothing was changed."
            exit 1
          fi
          echo "latest before: $(npm view @expo/serve-sim dist-tags.latest)"

      - name: Point latest at the target version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ROLLBACK_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          npm dist-tag add "@expo/serve-sim@$VERSION" latest
          echo "latest after: $(npm view @expo/serve-sim dist-tags.latest)"

      - name: Deprecate the bad version
        if: inputs.deprecate != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ROLLBACK_TOKEN }}
          BAD: ${{ inputs.deprecate }}
          REASON: ${{ inputs.reason }}
        run: npm deprecate "@expo/serve-sim@$BAD" "$REASON"
